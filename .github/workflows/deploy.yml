name: Deploy

# Деплоит ТОЛЬКО backend/ — готовый продукт по specs/001-ai-monitoring-center/plan.md.
# Пока backend/Dockerfile нет, job deploy помечается как skipped, а не зелёный.
# Включается переменной репозитория DEPLOY_ENABLED=true.
# Секреты: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY; опционально APP_ENV — содержимое backend/.env.
# Спецификация: specs/002-deploy/spec.md

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  check:
    name: Готов ли backend к деплою
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "backend/Dockerfile найден — деплоим"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Деплой пропущен::backend/Dockerfile ещё нет — деплоится только готовый backend"
          fi

  deploy:
    name: Деплой backend на демо-сервер
    needs: check
    if: ${{ vars.DEPLOY_ENABLED == 'true' && needs.check.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DIR: /opt/ai-gpr-center
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: Проверить compose-файл до выхода на сервер
        run: docker compose -f docker-compose.yml config --quiet

      - name: Подготовить SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::секрет DEPLOY_SSH_KEY не задан"; exit 1; }
          test -n "$DEPLOY_HOST"    || { echo "::error::секрет DEPLOY_HOST не задан"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20" >> "$GITHUB_ENV"

      - name: Подготовить сервер (Docker, каталог, порт) — идемпотентно
        run: ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/bootstrap.sh

      - name: Доставить код (rsync; .env, данные и context/ не трогаем)
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude 'backend/.env' --exclude 'backend/data' \
            --exclude 'news_parser' --exclude 'context' --exclude 'specs' --exclude 'docs' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"

      - name: Конфигурация приложения из секрета APP_ENV (если задан)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -n "$APP_ENV" ]; then
            printf '%s\n' "$APP_ENV" | ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > $APP_DIR/backend/.env"
            echo "backend/.env записан из APP_ENV"
          else
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "touch $APP_DIR/backend/.env"
            echo "::warning::секрет APP_ENV не задан — backend/.env пустой, LLM-вызовы работать не будут"
          fi

      - name: Пересобрать и перезапустить
        run: ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cd $APP_DIR && docker compose up -d --build --remove-orphans"

      - name: Health gate — /api/health отвечает, иначе логи и провал
        run: |
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
            set -uo pipefail
            cd /opt/ai-gpr-center
            for i in $(seq 1 24); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
                echo "health OK после $((i*5)) с"; exit 0
              fi
              sleep 5
            done
            echo "::error::backend не ответил на /api/health за 120 с"
            docker compose ps
            docker compose logs --tail 100
            exit 1
          REMOTE

      - name: Итог
        run: echo "Задеплоено — http://$DEPLOY_HOST:8000/api/health"
