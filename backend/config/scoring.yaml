# Методика оценки влияния — воспроизводит docs/scoring-methodology.md дословно.
# Источник: context/Для_ИТМО_мониторинг_НПА_и_отрасли.xlsx, лист «Методика», реестр GS Labs от 28.08.2026.
#
# ВАЖНО: это методика заказчика. Изменение любого веса, порога или формулировки
# требует ADR (см. .specify/memory/constitution.md, раздел «Рабочий процесс»).
# Индекс вычисляет код (src/scoring/formula.py), модель выставляет только баллы 0-3.

# ---------------------------------------------------------------- НПА: индекс влияния (ИВ)
npa:
  scheme: npa_k1_k6
  # Делитель формулы: максимальный балл по шкале. ИВ = (Σ балл×вес) / divisor × 100
  divisor: 3
  criteria:
    - code: К1
      name: Применимость к деятельности компании
      weight: 0.25
      scale:
        0: не применимо
        1: косвенно, общеотраслевой характер
        2: применимо к части продуктов
        3: прямое влияние на ключевые продукты или выручку
    - code: К2
      name: Юридическая сила и стадия принятия
      weight: 0.15
      scale:
        0: информационный или зарубежный акт
        1: законопроект внесён
        2: принят в чтениях, готовится к подписанию
        3: подписан или действует
    - code: К3
      name: Финансовое воздействие
      weight: 0.20
      scale:
        0: отсутствует
        1: незначительное
        2: существенное — комплаенс-расходы, налоги, льготы
        3: критическое — прямое влияние на выручку или издержки
    - code: К4
      name: Операционная сложность адаптации
      weight: 0.15
      scale:
        0: действий не требуется
        1: точечные изменения документов или процессов
        2: изменения продуктов или инфраструктуры
        3: перестройка ключевых процессов
    - code: К5
      name: Юридический и репутационный риск
      weight: 0.15
      scale:
        0: ответственность не предусмотрена
        1: незначительная административная
        2: существенная административная или оборотная
        3: уголовная или блокирующая деятельность
    - code: К6
      name: Срочность — время до применения
      weight: 0.10
      scale:
        0: свыше 12 месяцев
        1: от 6 до 12 месяцев
        2: от 1 до 6 месяцев
        3: менее месяца или уже действует
  # Категория — наибольший порог, не превышающий индекс.
  categories:
    - min_score: 0
      name: Незначительное
      reaction: Архивирование с пометкой «на заметку»; действие не требуется
    - min_score: 25
      name: Низкое
      reaction: Фиксация в реестре; переоценка при изменении стадии; пересмотр раз в квартал
    - min_score: 50
      name: Среднее
      reaction: Разбор в плановом цикле (2 недели); включение в квартальный обзор
    - min_score: 75
      name: Высокое
      reaction: Разбор профильным экспертом (3 рабочих дня); план действий с руководством (неделя)
    - min_score: 90
      name: Критическое
      reaction: Немедленная эскалация руководству и юристу; план действий за 2 рабочих дня
  # Релевантность выводится из критерия применимости, отдельный вызов модели не делается.
  relevance_criterion: К1

# ---------------------------------------------------------------- Новости: индекс актуальности (ИА)
news:
  scheme: news_h1_h4
  divisor: 3
  criteria:
    - code: Н1
      name: Актуальность события
      weight: 0.30
      scale:
        0: архивное
        1: старше месяца
        2: текущий месяц
        3: произошло на этой неделе, тема активно развивается
    - code: Н2
      name: Релевантность продуктам и бизнесу компании
      weight: 0.30
      scale:
        0: не связано
        1: косвенно
        2: затрагивает часть продуктов или процессов
        3: прямое влияние на выручку, затраты или продуктовую стратегию
    - code: Н3
      name: Масштаб для отрасли
      weight: 0.20
      scale:
        0: локальное
        1: сегмент рынка
        2: вся ИТ- или ТВ-отрасль РФ
        3: отрасль и смежные рынки, госполитика
    - code: Н4
      name: Динамика развития
      weight: 0.20
      scale:
        0: статично
        1: единичное событие
        2: развивается, новые шаги в 6-12 месяцев
        3: стремительно, события каждую неделю или месяц
  categories:
    - min_score: 0
      name: Фон
      reaction: Архив; пересмотр не требуется
    - min_score: 25
      name: На заметку
      reaction: Краткая фиксация; пересмотр раз в квартал
    - min_score: 50
      name: Актуально
      reaction: Включить в еженедельный дайджест; мониторинг развития
    - min_score: 75
      name: Горячая тема
      reaction: Разбор на неделе публикации; оценка влияния на планы компании
  relevance_criterion: Н2

# ---------------------------------------------------------------- Флаги эскалации
# Закрытый список. Модель может предложить флаг только дословной формулировкой из этого
# перечня (см. contracts/llm-contracts.md); свободные формулировки отбрасываются кодом.
# Сработавший флаг поднимает итоговую категорию на одну ступень.
escalation_flags:
  - id: strategic_assets
    text: Акт относит оборот ИИ, защиту конфиденциальной информации, деятельность ЦОД или доверенное ПО к стратегически значимым объектам
  - id: criminal_genai
    text: Акт вводит новую уголовную ответственность за генеративный ИИ или дипфейки, применимую к функциям компании
  - id: it_accreditation
    text: Акт меняет критерии ИТ-аккредитации или условия налоговых и кадровых льгот для ИТ-компаний
  - id: court_standard
    text: Судебный акт формирует новый стандарт доказывания или ответственности по спорам о переработке ПО либо коммерческой тайне
  - id: service_suspension
    text: Санкция может привести к приостановке деятельности информационного ресурса или сервиса компании
