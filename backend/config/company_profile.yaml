# Профиль компании — конфигурация релевантности, а не описание проекта (ADR-0005).
# Подставляется в промпты оценки. Смена этого файла меняет оценку всей ленты без правки кода.
# Человекочитаемый источник: docs/company-profile.md.
#
# ТРЕБУЕТ ПОДТВЕРЖДЕНИЯ ЗАКАЗЧИКОМ: перечень продуктов и точный список режимов — открытый
# вопрос OQ-01 (specs/001-ai-monitoring-center/open-questions.md). Профиль восстановлен
# по саммари созвона, реестру и открытым данным.

profiles:
  - slug: gs-labs
    name: GS Labs
    is_active: true
    industry: >
      Российский разработчик программного обеспечения и технологий для платного телевидения
      и цифровых сервисов. Входит в группу GS Group.
    products:
      - Системы условного доступа (CAS) для операторов платного ТВ и вещателей
      - DRM для аудиовизуальных сервисов
      - ПО для абонентского оборудования и ТВ-приставок, middleware, пользовательские интерфейсы
      - Программные платформы для OTT и онлайн-видеосервисов
      - Контрактное производство электроники в контуре группы
    regimes:
      - ИТ-компания с аккредитацией Минцифры
      - Налоговые льготы для ИТ — страховые взносы, налог на прибыль
      - ПО включено или претендует на включение в реестр российского ПО
      - Не относится к малому и среднему предпринимательству
      - Продукты используются на объектах КИИ в сфере связи
      - Обработка персональных данных абонентов по 152-ФЗ
      - Участник закупок по 44-ФЗ и 223-ФЗ
    risk_areas:
      - Регулирование CAS и DRM, обязательный переход на решения из реестра российского ПО
      - Требования к реестру российского ПО и совместимость с доверенными ОС
      - Категорирование и импортозамещение на объектах КИИ
      - Защита персональных данных, проверки Роскомнадзора и ФСТЭК
      - Лицензирование телевизионного и радиовещания у клиентов-вещателей
      - Регулирование ИИ, маркировка ИИ-контента, права на обучающие данные
      - Административная и уголовная ответственность в цифровой сфере
    growth_areas:
      - Гранты и льготное финансирование ИТ-проектов
      - Налоговые льготы для ИТ и для внедрения ИИ
      - Приоритет отечественных решений в государственных закупках
      - Федеральные проекты и нацпроекты технологического лидерства
      - Меры поддержки производства электроники
    competitors:
      - Российские вендоры CAS, DRM и middleware
      - Разработчики платформ платного ТВ и OTT
      - Крупные операторы и онлайн-кинотеатры как формирователи требований рынка
    noise_markers:
      - Агрономия, сельское хозяйство, пищевая промышленность
      - Меры поддержки малого и среднего предпринимательства
      - Общая футурология об ИИ без регуляторного или рыночного следствия
      - Региональные новости без связи с отраслью
      - Зарубежное регулирование без применения к деятельности в РФ

