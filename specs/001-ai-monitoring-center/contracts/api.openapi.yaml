openapi: 3.1.0
info:
  title: Интеллектуальный центр PR/GR-мониторинга — внутренний API
  version: 0.1.0
  description: >
    Контракт между backend и frontend. Фиксируется ДО начала кодирования и служит
    границей между дорожками двух инженеров. Изменение контракта — только через
    правку spec.md и этого файла, никогда в одностороннем порядке.
    Авторизация в MVP отсутствует по решению заказчика.
servers:
  - url: http://localhost:8000/api

tags:
  - name: feed
  - name: items
  - name: acts
  - name: sources
  - name: profiles
  - name: digests

paths:
  /health:
    get:
      summary: Живость сервиса — используется health gate деплоя (specs/002-deploy)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } }

  /feed:
    get:
      tags: [feed]
      summary: Лента материалов, отсортированная по убыванию индекса (FR-020, FR-021)
      parameters:
        - { name: date_from,  in: query, schema: { type: string, format: date-time } }
        - { name: date_to,    in: query, schema: { type: string, format: date-time } }
        - { name: source_id,  in: query, schema: { type: integer } }
        - { name: item_type,  in: query, schema: { type: string, enum: [news, act] } }
        - { name: topic,      in: query, schema: { type: string, enum: [regulatory, reputation, competitors, trends] } }
        - { name: category,   in: query, schema: { type: string } }
        - { name: q,          in: query, description: "полнотекстовый поиск по тексту, тегам и сущностям (FR-022)", schema: { type: string } }
        - { name: include_irrelevant, in: query, description: "показать отфильтрованное как шум (FR-018)", schema: { type: boolean, default: false } }
        - { name: include_hidden,     in: query, schema: { type: boolean, default: false } }
        - { name: limit,  in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ItemCard" } }
                  total: { type: integer }

  /items/{id}:
    get:
      tags: [items]
      summary: Карточка материала с разложением оценки и заземлением (FR-024, FR-025)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemDetail" } } } }
        "404": { description: Not found }
    patch:
      tags: [items]
      summary: Правка полей материала (FR-040, FR-044)
      description: Изменённые поля фиксируются в журнале правок и не перезаписываются переобработкой (FR-042, FR-043).
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:      { type: string }
                summary:    { type: string }
                topic:      { type: string, enum: [regulatory, reputation, competitors, trends] }
                tags:       { type: array, items: { type: string } }
                user_note:  { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemDetail" } } } }

  /items/{id}/assessment:
    patch:
      tags: [items]
      summary: Правка отдельных баллов; индекс и категория пересчитываются немедленно (FR-041)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                scores:
                  type: object
                  additionalProperties: { type: integer, minimum: 0, maximum: 3 }
                escalation_flags: { type: array, items: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } } }
        "422": { description: Балл вне диапазона 0–3 или неизвестный критерий }

  /items/{id}/hide:
    post:
      tags: [items]
      summary: Скрыть или вернуть публикацию (FR-045)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { hidden: { type: boolean } } } } }
      responses: { "204": { description: OK } }

  /items:
    post:
      tags: [items]
      summary: Ручное добавление материала (FR-009)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, raw_text]
              properties:
                title:        { type: string }
                raw_text:     { type: string }
                url:          { type: string }
                published_at: { type: string, format: date-time }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ItemDetail" } } } } }

  /items/{id}/track-as-act:
    post:
      tags: [acts]
      summary: Перевести материал в отслеживаемое досье НПА (FR-030)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ActDetail" } } } } }

  /acts:
    get:
      tags: [acts]
      summary: Список досье НПА
      parameters:
        - { name: stage,    in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ActCard" } } } } } }

  /acts/{id}:
    get:
      tags: [acts]
      summary: Досье с хронологией и историей оценок (FR-031, FR-033, FR-035)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActDetail" } } } } }
    patch:
      tags: [acts]
      summary: Изменение стадии; инициирует переоценку влияния (FR-034)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:       { type: string, enum: [announcement, draft_discussion, submitted, readings, adopted, in_force] }
                is_archived: { type: boolean }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActDetail" } } } } }

  /acts/{id}/events:
    post:
      tags: [acts]
      summary: Добавить событие в хронологию (FR-033)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActEvent" } } }
      responses: { "201": { description: Created } }

  /acts/{id}/link-item:
    post:
      tags: [acts]
      summary: Связать материал с досье (FR-036)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [item_id], properties: { item_id: { type: integer } } } } }
      responses: { "204": { description: OK } }

  /sources:
    get:
      tags: [sources]
      summary: Список источников со статусом сбора
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Source" } } } } } }
    post:
      tags: [sources]
      summary: Добавить источник (FR-003)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, url]
              properties:
                type:     { type: string, enum: [rss, web, telegram] }
                url:      { type: string }
                title:    { type: string }
                category: { type: string, enum: [media, regulator, telegram] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } } }
        "422": { description: URL недоступен или тип не соответствует содержимому }

  /sources/{id}:
    patch:
      tags: [sources]
      summary: Включить, отключить или переименовать источник (FR-004)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:             { type: string }
                is_active:         { type: boolean }
                poll_interval_min: { type: integer }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } } } }
    delete:
      tags: [sources]
      summary: Удалить источник; собранные материалы сохраняются (FR-004)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: OK } }

  /sources/{id}/collect:
    post:
      tags: [sources]
      summary: Немедленный запуск сбора — используется на демонстрации
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "202": { description: Accepted } }

  /profiles:
    get:
      tags: [profiles]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CompanyProfile" } } } } } }

  /profiles/{id}/activate:
    post:
      tags: [profiles]
      summary: Переключить активный профиль и переоценить материалы (FR-052)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "202": { description: Accepted } }

  /stories/{id}/split:
    post:
      tags: [items]
      summary: Разъединить ошибочно объединённый кластер (FR-062)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: OK } }

  /digests:
    post:
      tags: [digests]
      summary: Собрать дайджест из отобранных материалов (FR-070)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, item_ids]
              properties:
                recipient: { type: string }
                title:     { type: string }
                item_ids:  { type: array, items: { type: integer } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Digest" } } } } }

  /digests/{id}/export:
    get:
      tags: [digests]
      summary: Выгрузка дайджеста для отправки по почте (FR-072)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: format, in: query, schema: { type: string, enum: [html, md], default: html } }
      responses: { "200": { description: OK, content: { text/html: { schema: { type: string } } } } }

components:
  schemas:
    ItemCard:
      type: object
      required: [id, title, summary, item_type, index_value, final_category, url]
      properties:
        id:              { type: integer }
        title:           { type: string }
        summary:         { type: string, description: "3–5 предложений (FR-010)" }
        entities:        { $ref: "#/components/schemas/Entities" }
        item_type:       { type: string, enum: [news, act] }
        topic:           { type: string }
        index_value:     { type: number, description: "ИВ или ИА, вычислено кодом (FR-016)" }
        final_category:  { type: string }
        escalation_flags: { type: array, items: { type: string } }
        url:             { type: string, description: "ссылка на оригинал (FR-023)" }
        source:          { type: object, properties: { id: { type: integer }, title: { type: string } } }
        published_at:    { type: string, format: date-time }
        is_partial_text: { type: boolean }
        is_edited:       { type: boolean, description: "есть пользовательские правки" }
        story:           { type: object, nullable: true, properties: { id: { type: integer }, item_count: { type: integer } } }
        act_id:          { type: integer, nullable: true }
        tags:            { type: array, items: { type: string } }

    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemCard"
        - type: object
          properties:
            raw_text:   { type: string }
            claims:     { type: array, items: { $ref: "#/components/schemas/Claim" } }
            assessment: { $ref: "#/components/schemas/Assessment" }
            user_note:  { type: string, nullable: true }
            revisions:  { type: array, items: { $ref: "#/components/schemas/Revision" } }

    Claim:
      type: object
      description: Заземление утверждения саммари на оригинал (FR-012, FR-025)
      required: [statement, quote]
      properties:
        statement:  { type: string }
        quote:      { type: string }
        char_start: { type: integer }
        char_end:   { type: integer }

    Entities:
      type: object
      description: Ключевые сущности (FR-011)
      properties:
        who:          { type: array, items: { type: string } }
        what:         { type: string }
        when:         { type: string }
        consequences: { type: string }

    Assessment:
      type: object
      required: [scheme, scores, rationales, index_value, category, final_category, author]
      properties:
        scheme:      { type: string, enum: [npa_k1_k6, news_h1_h4] }
        scores:      { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 3 } }
        rationales:  { type: object, additionalProperties: { type: string } }
        index_value: { type: number }
        category:    { type: string }
        escalation_flags: { type: array, items: { type: string } }
        final_category:   { type: string }
        author:      { type: string, enum: [ai, human] }
        model:       { type: string, nullable: true }
        prompt_version: { type: string, nullable: true }
        created_at:  { type: string, format: date-time }

    ActCard:
      type: object
      required: [id, act_identifier, doc_type, stage]
      properties:
        id:             { type: integer }
        act_identifier: { type: string }
        doc_type:       { type: string }
        stage:          { type: string }
        index_value:    { type: number }
        final_category: { type: string }
        is_archived:    { type: boolean }
        effective_from: { type: string, format: date, nullable: true }

    ActDetail:
      allOf:
        - $ref: "#/components/schemas/ActCard"
        - type: object
          properties:
            essence:            { type: string }
            source_url:         { type: string }
            timeline:           { type: array, items: { $ref: "#/components/schemas/ActEvent" } }
            assessment_history: { type: array, items: { $ref: "#/components/schemas/Assessment" }, description: "динамика влияния (FR-035)" }
            linked_items:       { type: array, items: { $ref: "#/components/schemas/ItemCard" } }

    ActEvent:
      type: object
      required: [event_type, occurred_at, description]
      properties:
        event_type:     { type: string, enum: [stage_change, new_version, feedback, hearing, other] }
        occurred_at:    { type: string, format: date }
        description:    { type: string }
        version_label:  { type: string, nullable: true }
        document_url:   { type: string, nullable: true }
        source_item_id: { type: integer, nullable: true }

    Source:
      type: object
      required: [id, type, url, is_active]
      properties:
        id:                { type: integer }
        type:              { type: string, enum: [rss, web, telegram, manual] }
        url:               { type: string }
        title:             { type: string }
        category:          { type: string }
        is_active:         { type: boolean }
        poll_interval_min: { type: integer }
        last_polled_at:    { type: string, format: date-time, nullable: true }
        last_error:        { type: string, nullable: true }
        item_count:        { type: integer }

    CompanyProfile:
      type: object
      required: [id, name, is_active]
      properties:
        id:            { type: integer }
        name:          { type: string }
        industry:      { type: string }
        products:      { type: array, items: { type: string } }
        regimes:       { type: array, items: { type: string } }
        risk_areas:    { type: array, items: { type: string } }
        growth_areas:  { type: array, items: { type: string } }
        competitors:   { type: array, items: { type: string } }
        noise_markers: { type: array, items: { type: string } }
        is_active:     { type: boolean }

    Digest:
      type: object
      properties:
        id:         { type: integer }
        recipient:  { type: string }
        title:      { type: string }
        created_at: { type: string, format: date-time }
        items:      { type: array, items: { $ref: "#/components/schemas/ItemCard" } }

    Revision:
      type: object
      properties:
        field:      { type: string }
        old_value:  {}
        new_value:  {}
        author:     { type: string }
        created_at: { type: string, format: date-time }
