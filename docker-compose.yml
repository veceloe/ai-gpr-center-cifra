# Деплой-конфигурация демо-сервера: backend по specs/001-ai-monitoring-center/plan.md.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-gpr-backend
    env_file:
      - ./backend/.env
    # Прокси для исходящих запросов к модели. Нужен там, где провайдер блокирует
    # IP хоста: OpenRouter отвечает демо-серверу «Access denied by security policy».
    # Значение берётся из .env рядом с этим файлом (на сервере, в репозиторий не
    # попадает); пусто — ходим напрямую, как и раньше.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      HTTP_PROXY: ${LLM_HTTP_PROXY:-}
      HTTPS_PROXY: ${LLM_HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - backend_data:/app/data
    ports:
      - "8239:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend_data:
