# Деплой-конфигурация демо-сервера: только backend по specs/001-ai-monitoring-center/plan.md.
# Драфт news_parser/ здесь не участвует — у него свой dev-compose внутри каталога.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-gpr-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend_data:
